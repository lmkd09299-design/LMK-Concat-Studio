name: LMK Recap Bridge standalone Windows EXE
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'standalone/**'
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build-standalone.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without Google/Concat keys
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q main.py standalone
  windows-exe:
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build self-contained GUI EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LMK-Recap-Bridge `
            --collect-all faster_whisper --collect-all ctranslate2 `
            --collect-all imageio_ffmpeg --collect-all edge_tts `
            --collect-all av --collect-all tokenizers `
            main.py
      - name: Confirm EXE exists and is nonempty
        shell: pwsh
        run: |
          $file = 'dist/LMK-Recap-Bridge.exe'
          if (-not (Test-Path $file)) { throw 'EXE missing' }
          if ((Get-Item $file).Length -lt 15000000) { throw 'EXE suspiciously small' }
          Get-Item $file | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: LMK-Recap-Bridge-Windows-x64
          path: dist/LMK-Recap-Bridge.exe
          retention-days: 14
